<!DOCTYPE html>
<meta charset="utf-8">
<style>

.states {
  fill: none;
  stroke: #fff;
  stroke-linejoin: round;
}

</style>
<body>
<script src="//d3js.org/d3.v3.min.js"></script>
<script src="//d3js.org/queue.v1.min.js"></script>
<script src="//d3js.org/topojson.v1.min.js"></script>
<script>
<!--
  This D3.js script renders a map of the Democratic Republic of Congo.
  - Geographical boundaries are loaded from "drcongo.json" (TopoJSON format).
  - Enrollment data for coloring territories is loaded from "enroleTerritoire.csv".
  - Assumptions made for data mapping:
    - Territories in the TopoJSON are identified by the 'ADM2' property, 
      which is expected to match the 'nomterritoire' column in the CSV.
    - Provinces in the TopoJSON are identified by the 'ADM1' property,
      which is used to draw the main internal administrative boundaries.
-->

var width = 960,
    height = 500;

var color = d3.scale.threshold()
    .domain([0.02, 0.04, 0.06, 0.08, 0.10])
    .range(["#f2f0f7", "#dadaeb", "#bcbddc", "#9e9ac8", "#756bb1", "#54278f"]);

var path = d3.geo.path();

var svg = d3.select("body").append("svg")
    .attr("width", width)
    .attr("height", height);

queue()
    .defer(d3.json, "drcongo.json")
    .defer(d3.csv, "enroleTerritoire.csv")
    .await(ready);

function ready(error, ZAI, enroles) {
  if (error) throw error;

  var rateById = {};

  enroles.forEach(function(d) { rateById[d.nomterritoire] = +d.nombreenroles; });

  svg.append("g")
      .attr("class", "counties")
    .selectAll("path")
      .data(topojson.feature(ZAI, ZAI.objects.ZAI).features)
    .enter().append("path")
      .attr("d", path)
      .style("fill", function(d) { return color(rateById[d.properties.ADM2]); });

  svg.append("path")
      .datum(topojson.mesh(ZAI, ZAI.objects.ZAI, function(a, b) { return a.properties.ADM1 !== b.properties.ADM1; }))
      .attr("class", "states")
      .attr("d", path);
}

</script>
</body>
</html>
